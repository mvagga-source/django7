<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
    <style>
        #chart_back{width:1000px;height:510px;border:1px solid black;}
    </style>
</head>
<body>
    <div>
        <h2>차트 그리기</h2>
        <input type='text' name='m_data' id='m_data'>
        <button type='button' onclick='chartBtn()'>가져오기</button>
    </div><br>
    <div id='chart_back'>
        <canvas id="myChart"></canvas>
    </div>

    <script>

        function chartBtn(){

            alert('데이터를 가져와 차트를 그립니다.')

            // 요청번호
            let input_data = $("#m_data").val();

            // chart 그리기에 필요한 테이터
            let label_data = [];
            let d_data = [];

            // ajax으로 통신
            $.ajax({
                url:'/chart2_json/',
                type:'get',
                dataType:'json',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'input_data':input_data},
                success:function(data){
                    alert('성공');

                    console.log(data)
                    
                    for (let i=0;i<data.list.length;i++){
                        d_data.push(data.list[i].cdata)
                        label_data.push(data.list[i].cyear)
                    }

                    // 비동기 방식으로 진행되어 ajax 데이터가 늦게 전달이 됨
                    // 차트 그리기 명령어도 ajax안에 입력이 되어야 함

                    const ctx = document.getElementById('myChart');

                    new Chart(ctx, {
                        type: 'line',
                        data: {
                        labels: label_data,
                        datasets: [{
                            label: '# of Votes',
                            data: d_data,
                            borderWidth: 10,
                            backgroundColor: '#36A2EB'
                        }]
                        },
                        options: {
                        scales: {
                            y: {
                            beginAtZero: true
                            }
                        }
                        }
                    });
                    
                    Chart.defaults.borderColor = '#99999'

                },
                error:function(){
                    alert('실패');
                }

            });
        } 
    </script>
    
</body>
</html>
